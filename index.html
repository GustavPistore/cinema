<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>compra de ingressos</h1>

        <div class="filmes">

            <div class="filme">
                <div class="poster poster1"></div>
                <div class="info">
                    <p>Diário de uma paixão - R$ 20</p>
                    Quantidade:
                    <input type="number" value="0" min="0">
                    <p>Subtotal: R$ 0</p>
                </div>
            </div>

            <div class="filme">
                <div class="poster poster2"></div>
                <div class="info">
                    <p>Cães de caça - R$ 25</p>
                    Quantidade:
                    <input type="number" value="0" min="0">
                    <p>Subtotal: R$ 0</p>
                </div>
            </div>

            <div class="filme">
                <div class="poster poster3"></div>
                <div class="info">
                    <p>Demon slayer - R$ 30</p>
                    Quantidade:
                    <input type="number" value="0" min="0">
                    <p>Subtotal: R$ 0</p>
                </div>
            </div>

        </div>

        <hr>

        <h2>total: R$ 0</h2>

        <button>Finalizar compra</button>
    </div>
</body>
</html>
