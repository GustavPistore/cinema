<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>compra de ingressos</h1>

        <div class="filmes">

            <div class="filme">
                <div class="poster poster1"></div>
                <div class="info">
                    <p>Diário de uma paixão - R$ 20</p>
                    Quantidade:
                    <input type="number" value="0" min="0" id="input1">
                    <p id="subtotal1">Subtotal: R$ 0</p>
                </div>
            </div>

            <div class="filme">
                <div class="poster poster2"></div>
                <div class="info">
                    <p>Cães de caça - R$ 25</p>
                    Quantidade:
                    <input type="number" value="0" min="0" id="input2">
                    <p id="subtotal2">Subtotal: R$ 0</p>
                </div>
            </div>

            <div class="filme">
                <div class="poster poster3"></div>
                <div class="info">
                    <p>Demon slayer - R$ 30</p>
                    Quantidade:
                    <input type="number" value="0" min="0" id="input3">
                    <p id="subtotal3">Subtotal: R$ 0</p>
                </div>
            </div>

        </div>

        <hr>

        <h2 id="total">total: R$ 0,00</h2>
        <button id="finalizar">Finalizar compra</button>
        <script src="script.js"></script>
    </div>
</body>
</html>
